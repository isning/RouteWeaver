name: Supplemental UX recovery feedback

# This bounded subset never replaces Repository quality or its required aggregate.
on:
  push:
    branches:
      - 'ux-task-journeys-*'

permissions:
  contents: read

# Finish the running review; newer pushes replace only the single pending run.
concurrency:
  group: ux-recovery-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: "true"
  GOMEMLIMIT: 768MiB
  npm_config_cache: ${{ github.workspace }}/bin/cache/npm

jobs:
  recovery:
    name: Twenty-six recovery specs (supplemental evidence only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Vendor-installed binary covered by the runner's Chrome AppArmor profile.
      ROUTEWEAVER_CHROMIUM: /opt/google/chrome/chrome
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
          node: "true"
      - name: Install browser OS dependencies and CJK fonts
        working-directory: web
        run: npx --no-install playwright install-deps chromium
      - name: Verify installed Chrome Stable and sandboxed startup
        working-directory: web
        run: |
          test "$(readlink -f "$ROUTEWEAVER_CHROMIUM")" = /opt/google/chrome/chrome
          test -x "$ROUTEWEAVER_CHROMIUM"
          test "$(dpkg-query -S "$ROUTEWEAVER_CHROMIUM")" = "google-chrome-stable: /opt/google/chrome/chrome"
          expected=$(dpkg-query --control-show google-chrome-stable md5sums | awk '$2 == "opt/google/chrome/chrome" { print $1 }')
          [[ "$expected" =~ ^[0-9a-f]{32}$ ]]
          printf '%s  %s\n' "$expected" "$ROUTEWEAVER_CHROMIUM" | md5sum --check --strict
          node --input-type=module <<'JS'
          import { chromium } from 'playwright';
          import { execFileSync } from 'node:child_process';
          import { mkdirSync, writeFileSync } from 'node:fs';
          const executablePath = process.env.ROUTEWEAVER_CHROMIUM;
          const evidence = {
            runnerImage: process.env.ImageOS,
            runnerImageVersion: process.env.ImageVersion,
            executablePath,
            playwrightShard: process.env.ROUTEWEAVER_BROWSER_SHARD,
            installedVersion: execFileSync(executablePath, ['--version'], { encoding: 'utf8' }).trim(),
            packageVersion: execFileSync('dpkg-query', ['-W', '-f=${Version}', 'google-chrome-stable'], { encoding: 'utf8' }).trim(),
            executableSHA256: execFileSync('sha256sum', [executablePath], { encoding: 'utf8' }).split(' ')[0],
            chromiumSandbox: true,
            startup: 'not-confirmed',
          };
          const record = () => {
            mkdirSync('../bin/verification', { recursive: true });
            writeFileSync('../bin/verification/browser-environment.json', JSON.stringify(evidence, null, 2) + '\n');
            console.log(JSON.stringify(evidence));
          };
          record();
          const browser = await chromium.launch({ executablePath, chromiumSandbox: true });
          try {
            evidence.browserVersion = browser.version();
            const page = await browser.newPage();
            await page.setContent('<title>Sandboxed browser startup</title>');
            if (await page.title() !== 'Sandboxed browser startup') throw new Error('Browser startup page failed');
            evidence.startup = 'passed';
            record();
          } finally {
            await browser.close();
          }
          JS
      - name: Run twenty-six recovery specs with unchanged fixtures
        working-directory: web
        # Bound this subset without changing per-test timeouts; reserve cleanup/upload time.
        timeout-minutes: 10
        run: npm run test:browser -- --config=playwright.ux-recovery.config.ts --workers=1 --retries=0
      - name: Supplemental recovery diagnostics for this commit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ux-recovery-supplemental-${{ github.sha }}
          # Only the synthetic report, browser receipt and named test captures.
          # No databases, fixture keys, automatic screenshots, video or traces.
          path: |
