name: Focused UX journey regressions

on:
  push:
    branches:
      - 'ux-task-journeys-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ux-focused-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  npm_config_cache: ${{ github.workspace }}/bin/cache/npm

jobs:
  focused:
    name: Focused UI task regressions (supplemental)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - run: npm --prefix web run typecheck
      - name: Run focused user-task behavior tests
        working-directory: web
        run: >-
          npm run test --
          src/server-forwarding.dom.test.tsx
          src/server-path-workspace.dom.test.tsx
          src/server-workspace.dom.test.tsx
          src/server-overview.dom.test.tsx
          src/infrastructure-tabs.dom.test.tsx
          src/infrastructure-creation.dom.test.tsx
          src/group-membership.dom.test.tsx
          src/profile-source-disclosure.dom.test.tsx
          src/profile-content-hierarchy.dom.test.tsx
          src/source-profile-continuation.dom.test.tsx
          --maxWorkers=1
# Supplemental feedback only. The full Repository quality workflow and its
# required aggregate remain authoritative; this does not replace any gate.

