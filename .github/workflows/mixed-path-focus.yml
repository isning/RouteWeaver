name: Focused mixed path regressions

on:
  push:
    branches:
      - 'ux-task-journeys-*'
      - 'acceptance-checkpoint-*-mixed-path*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mixed-path-focused-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  GOTOOLCHAIN: local
  GOCACHE: ${{ github.workspace }}/bin/cache/go-build
  GOMODCACHE: ${{ github.workspace }}/bin/cache/go-mod

jobs:
  focused:
    name: Mixed path compilation and publication (supplemental)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Check source formatting with repair diff
        shell: bash
        run: |
          formatter="$(scripts/go.sh env GOROOT)/bin/gofmt"
          "$formatter" -d internal/domain/published_hops*.go internal/domain/published_routes.go internal/domain/route_retarget.go internal/httpapi/published_mixed_paths*.go internal/httpapi/published_routes.go internal/httpapi/published_manifests.go internal/httpapi/published_route_retarget.go internal/store/diagnostics_paths.go internal/render/mixed_chain_test.go internal/integration/mixed_chain*.go runtimes/xray/config.go runtimes/xray/detour*.go
          scripts/format.sh --check
      - name: Run exact-source mixed path regressions
        if: ${{ !cancelled() }}
        run: >-
          scripts/go.sh test -race -p=1 -count=1 -timeout=6m
          ./internal/domain ./internal/render ./internal/httpapi ./internal/store
          -run 'Test(ResolvePublishedRouteHops|ServerMixedConnectorChain|PublishedMixedPaths|PublishedRoutePathSummary|ManagedRouteRetarget|RetargetManagedExit|ManagedDiagnostic)'
# Supplemental feedback only. The complete package suites and required
# Repository quality aggregate remain authoritative and are not replaced.
  ui:
    name: Mixed path display and edit preservation (supplemental)
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - run: npm --prefix web run typecheck
      - name: Run focused public path behavior tests
        working-directory: web
        run: >-
          npm run test -- src/published-route-mixed-hops.dom.test.tsx
          src/published-route-path.dom.test.tsx
          src/published-route-concurrent-edit.dom.test.tsx
          --maxWorkers=1
  managed:
    name: Managed detour validation and isolation (supplemental)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          go: "true"
      - name: Run exact-source managed detour regressions
        shell: bash
        run: |
          mkdir -p bin/verification
          scripts/go.sh -C runtimes/xray test -json -race -p=1 -count=1 -timeout=5m \
            -run 'Test(Managed.*Detour|NativeTwoDetours)' ./... | tee bin/verification/managed-detour-focused.jsonl
          python3 - <<'PY'
          import json
          events = [json.loads(line) for line in open('bin/verification/managed-detour-focused.jsonl') if line.strip()]
          package = 'routeweaver/runtimes/xray'
          cutoff = 'TestNativeTwoDetoursPreserveSingleAdmissionAccountingAndCutoff'
          denial = 'TestNativeTwoDetoursDoNotBypassDestinationOrAdmissionDenial'
          required = {
              'TestManagedAcceptsOnlyScopedAcyclicOutboundDetours',
              'TestManagedRejectsAmbiguousOrUnsupportedDetourGraphs',
              'TestManagedDetourSocketOptionsFailClosed',
              cutoff, denial, 'TestNativeTwoDetoursRevokeInterruptsRateQueuedPayload',
              *(cutoff + '/' + name for name in ('revoke', 'lease_expiry', 'byte_budget')),
              *(denial + '/' + name for name in ('private_IP', 'private_DNS', 'packet_destination', 'admission')),
          }
          passed = {event.get('Test') for event in events if event.get('Package') == package and event.get('Action') == 'pass'}
          skipped = [event.get('Test') for event in events if event.get('Package') == package and event.get('Action') == 'skip']
          if required - passed or skipped:
              raise SystemExit(f'Managed detour gate incomplete: missing={sorted(required - passed)}, skipped={skipped}')
          print('PASS: strict detour validation and all eight sustained-flow/denial scenarios; no skipped managed detour tests.')
          PY
